<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI SOC Lab</title>
    <!--
      GitHub Pages serves this repository from its root, so the root URL needs
      somewhere to go. The console itself lives in soc-ai-platform/ because that
      is where it lives in the project; moving it to the root to suit the host
      would be the tail wagging the dog.

      The redirect is a meta refresh rather than a script so it still works with
      JavaScript disabled, and the link below covers the case where even that is
      blocked.
    -->
    <meta http-equiv="refresh" content="0; url=./soc-ai-platform/">
    <link rel="canonical" href="./soc-ai-platform/">
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        background: #f6f8fb;
        color: #1b2838;
        text-align: center;
      }
      a { color: #2456c7; }
      @media (prefers-color-scheme: dark) {
        body { background: #11161d; color: #e7edf5; }
        a { color: #8ab4ff; }
      }
    </style>
  </head>
  <body>
    <p>Opening the AI SOC console…</p>
    <p><a href="./soc-ai-platform/">Continue to the console</a></p>
  </body>
</html>
