title: Certutil Used To Encode Or Decode Files
id: fda1cf98-bd12-4dae-a6d8-4e50b52fa58c
status: experimental
description: |
  Detects certutil.exe used with -encode, -decode, or -urlcache. Certutil is a
  signed Microsoft binary intended for certificate management, but it can also
  base64-encode files and download from a URL. Attackers use it to stage
  payloads past controls that trust signed Windows binaries.
author: AI SOC Lab
date: 2026/08/20
references:
  - https://attack.mitre.org/techniques/T1140/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith: '\\certutil.exe'
  selection_flags:
    CommandLine|contains:
      - '-encode'
      - '-decode'
      - '-urlcache'
      - '-verifyctl'
  condition: selection_image and selection_flags
fields:
  - Image
  - ParentImage
  - CommandLine
  - User
falsepositives:
  - Certificate administration performed by IT staff
  - Authorized SOC lab validation activity
level: high
tags:
  - attack.defense-evasion
  - attack.t1140
  - attack.command-and-control
  - attack.t1105
