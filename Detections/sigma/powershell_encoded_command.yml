title: PowerShell Encoded Command Execution
id: 28067373-b0ce-4b18-a32d-c42c59e5a22f
status: experimental
description: |
  Detects powershell.exe launched with -EncodedCommand or -enc, which runs a
  base64-encoded payload. Encoding hides the command from casual log review and
  from string-matching detections, so it is a common wrapper for malicious
  PowerShell. The encoding itself is not malicious; the decoded payload decides.
author: AI SOC Lab
date: 2026/08/20
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
  selection_encoded:
    CommandLine|contains:
      - ' -EncodedCommand '
      - ' -enc '
      - ' -ec '
  condition: selection_image and selection_encoded
fields:
  - Image
  - ParentImage
  - CommandLine
  - User
falsepositives:
  - Software deployment and configuration management tooling, which commonly encodes commands
  - Scheduled tasks created by legitimate installers
  - Authorized SOC lab validation activity
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
